<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" role="img" aria-label="Lume, o peixe-lanterna">
  <defs>
    <linearGradient id="lume-corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7fa3"/>
      <stop offset="1" stop-color="#123c5e"/>
    </linearGradient>
    <radialGradient id="lume-brilho">
      <stop offset="0" stop-color="#7cf5d2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7cf5d2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- cauda -->
  <path class="lume-cauda" d="M24 58 L4 40 Q9 58 4 76 Z" fill="#1d5a7d"/>
  <!-- barbatana de baixo -->
  <path d="M50 80 Q56 94 66 84 Z" fill="#1d5a7d"/>
  <!-- corpo -->
  <ellipse cx="60" cy="58" rx="40" ry="28" fill="url(#lume-corpo)"/>
  <!-- barriga -->
  <path d="M30 66 Q60 86 94 68 Q62 78 30 66 Z" fill="#7cf5d2" opacity="0.18"/>
  <!-- antena -->
  <path d="M74 32 Q80 8 98 12" fill="none" stroke="#2a7fa3" stroke-width="3" stroke-linecap="round"/>
  <!-- luz -->
  <circle class="lume-halo" cx="99" cy="12" r="12" fill="url(#lume-brilho)"/>
  <circle class="lume-luz" cx="99" cy="12" r="5.5" fill="#7cf5d2"/>
  <!-- olho -->
  <circle cx="76" cy="50" r="12" fill="#e8f4f8"/>
  <circle class="lume-pupila" cx="79" cy="51" r="6.5" fill="#06111f"/>
  <circle cx="81" cy="48" r="2" fill="#e8f4f8"/>
  <!-- boca -->
  <path class="lume-boca" d="M90 67 Q95 71 99 65" fill="none" stroke="#06111f" stroke-width="2.5" stroke-linecap="round"/>
</svg>
